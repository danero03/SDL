services:
  db:
    image: postgres:17
    container_name: postgres_task6
    environment:
      POSTGRES_DB: SecureDB
      POSTGRES_USER: erik
      POSTGRES_PASSWORD: P@ssw0rd
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  vault:
    image: hashicorp/vault:1.15
    container_name: vault_task6
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    volumes:
      - vault_file:/vault/file
    cap_add:
      - IPC_LOCK
    command:
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  pinger:
    build: .
    container_name: pinger_task6
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started
    env_file:
      - .env
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./logs:/logs # docker logs db_pinger

volumes:
  db_data:
  vault_file: